#!/bin/bash
# config/nvm.conf
# Configuration for the install-nvm project
# Sourced via `source`. Contains variables only.
#
# Changes:
#   - NODE_DEFAULT_VERSION pinned to an LTS alias
#   - added notes on version selection

# ============================================================
# NVM — version and install path
# ============================================================

# NVM version to install
# Current releases: https://github.com/nvm-sh/nvm/releases
NVM_VERSION="v0.39.7"

# Directory where NVM will be installed
NVM_DIR="${HOME}/.nvm"

# ============================================================
# Node.js — install parameters
# ============================================================

# Default Node.js version after NVM installation
#
# Options:
#   "lts/*"        — latest LTS (may resolve to Current, e.g. v24)
#   "lts/jod"      — Node.js 22.x (current LTS, recommended)
#   "lts/iron"     — Node.js 20.x (previous LTS)
#   "22"           — specific major version
#   "22.11.0"      — specific minor version
#
# Bitwarden CLI requires Node.js >= 20.
# An LTS version ensures stability and long-term support.
NODE_DEFAULT_VERSION="lts/jod"

# Whether to install Node.js by default after NVM installation
# true  — yes, nvm install + nvm alias default
# false — NVM only; Node.js is installed manually
INSTALL_NODE_DEFAULT=true

# ============================================================
# NPM — prefix settings
# ============================================================

# Prefix for global NPM packages
# Allows installing packages without sudo
NPM_PREFIX="${HOME}/.npm-global"

# ============================================================
# Logging
# ============================================================

# Directory for logs (relative to the project root)
LOG_DIR="./logs"

# Log level: DEBUG, INFO, WARN, ERROR
LOG_LEVEL="INFO"

# Whether to write logs to a file
LOG_TO_FILE=true

# Whether to write logs to the console
LOG_TO_CONSOLE=true

# ============================================================
# Script behavior
# ============================================================

# Stop the script on the first error
STOP_ON_ERROR=true

# Ask for confirmation before modifying the system
ASK_CONFIRMATION=true

# Check for conflicts (Node.js from apt/snap)
CHECK_CONFLICTS=true

# Minimum free disk space before installation (in MB)
MIN_DISK_SPACE_MB=500

# ============================================================
# Dependencies
# ============================================================

# Packages required to install NVM
REQUIRED_PACKAGES=("curl" "git")

# ============================================================
# Sources
# ============================================================

# URL of the official NVM installer
NVM_INSTALL_URL="https://raw.githubusercontent.com/nvm-sh/nvm/${NVM_VERSION}/install.sh"

# ============================================================
# Ensure the config is sourced, not executed directly
# ============================================================
if [ "${BASH_SOURCE[0]}" = "${0}" ]; then
    echo "ERROR: config/nvm.conf must be sourced, not executed directly." >&2
    echo "Usage: source config/nvm.conf" >&2
    exit 1
fi
